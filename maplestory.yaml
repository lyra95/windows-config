# https://github.com/microsoft/winget-dsc
# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2

properties:
  resources:
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: nexon-plug
      settings:
        id: Nexon.NexonPlug
        source: winget
    - resource: PSDscResources/Script
      id: SetSystemLocaleToKoKR
      directives:
        description: Set system locale for non-Unicode programs (requires reboot)
        securityContext: elevated
      settings:
        GetScript: |
          return @{ Result = (Get-WinSystemLocale -ErrorAction Stop).Name }
        TestScript: |
          return (Get-WinSystemLocale -ErrorAction Stop).Name -eq 'ko-KR'
        SetScript: |
          Set-WinSystemLocale -SystemLocale 'ko-KR' -ErrorAction Stop
          Write-Warning '시스템 로캘 변경을 완료하려면 Windows를 재부팅하세요.'

  configurationVersion: 0.2.0
