# https://github.com/microsoft/winget-dsc
# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2

properties:
  resources:
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: uv
      settings:
        id: astral-sh.uv
        source: winget
    - resource: PSDscResources/Script
      id: codex-cli-npm
      settings:
        GetScript: |
          $cmd = Get-Command codex -ErrorAction SilentlyContinue
          if ($null -eq $cmd) { return $false }
          codex --version *> $null
          return ($LASTEXITCODE -eq 0)
        TestScript: |
          $cmd = Get-Command codex -ErrorAction SilentlyContinue
          if ($null -eq $cmd) { return $false }
          codex --version *> $null
          return ($LASTEXITCODE -eq 0)
        SetScript: |
          npm install --global @openai/codex
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: claude
      settings:
        id: Anthropic.Claude
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: claude-cli
      settings:
        id: Anthropic.ClaudeCode
        source: winget
    - resource: PSDscResources/Script
      id: claude-completion
      directives:
        securityContext: elevated
      settings:
        GetScript: |
          return $false
        TestScript: |
          $target = Join-Path $HOME '.config\my-ps-scripts\claude-completion.ps1'
          $item = Get-Item -Path $target -Force -ErrorAction SilentlyContinue
          if ($null -eq $item) { return $false }
          return [bool]($item.LinkType -eq 'SymbolicLink' -and $item.Target -eq "${WinGetConfigRoot}\claude-completion.ps1")
        SetScript: |
          $target = Join-Path $HOME '.config\my-ps-scripts\claude-completion.ps1'
          $null = New-Item -ItemType Directory -Force -Path (Split-Path $target)
          $null = New-Item -ItemType SymbolicLink -Path $target -Target "${WinGetConfigRoot}\claude-completion.ps1" -Force

  configurationVersion: 0.2.0
