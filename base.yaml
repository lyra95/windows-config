# https://github.com/microsoft/winget-dsc
# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2

properties:
  resources:
    - resource: PSDscResources/Script
      id: Microsoft.WinGet.Client
      directives:
        description: Microsoft.WinGet.DSC/WinGetPackage requires the Microsoft.WinGet.Client module to be installed.
      settings:
        SetScript: |
          Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery | Out-Null;
        GetScript: |
          Get-Module -ListAvailable -Name Microsoft.WinGet.Client
        TestScript: |
          $modules = Get-Module -ListAvailable -Name Microsoft.WinGet.Client
          return $modules.Count -gt 0
    # $HOME\.local\bin 경로를 PATH에 추가
    - resource: PSDscResources/Script
      settings:
        GetScript: return $false
        TestScript: |
          $userEnv = [System.Environment]::GetEnvironmentVariable("PATH", "User");
          return $userEnv.Split(";") -contains "$HOME\.local\bin"
        SetScript: |
          $userEnv = [System.Environment]::GetEnvironmentVariable("PATH", "User");
          [System.Environment]::SetEnvironmentVariable("PATH", "$userEnv;$HOME\.local\bin", "User");

    # 파워쉘 프로필에서 로드할 스크립트 폴더 생성
    - resource: PSDscResources/Script
      id: my-ps-scripts
      settings:
        GetScript: return $false
        TestScript: |
          return Test-Path -Path "$HOME\.config\my-ps-scripts" -PathType Container
        SetScript: |
          $null = New-Item -ItemType Directory -Force -Path "$HOME\.config\my-ps-scripts"


    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vscode
      settings:
        id: Microsoft.VisualStudioCode
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: powershell
      settings:
        id: Microsoft.PowerShell
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: windows-terminal
      settings:
        id: Microsoft.WindowsTerminal
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: firefox
      settings:
        id: Mozilla.Firefox
        source: winget
    
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: fzf
      settings:
        id: junegunn.fzf
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: starship
      settings:
        id: Starship.Starship
        source: winget
    - resource: PSDscResources/Script
      id: psfzf
      settings:
        GetScript: return $false
        TestScript: |
          $modules = Get-Module -ListAvailable -Name PSFzf
          return $modules -ne $null
        SetScript: |
          Install-Module -Name PSFzf -Force -Repository PSGallery
    - resource: PSDscResources/Script
      id: powershell-profile
      dependsOn:
        - powershell
      directives:
        description: 파워쉘 프로필을 이 리포의 profile.ps1로 심볼릭 링크
        securityContext: elevated
      settings:
        GetScript: return $false
        TestScript: |
          $profilePath = pwsh -NoProfile -Command 'Write-Output $PROFILE'
          $item = Get-Item -Path $profilePath -Force -ErrorAction SilentlyContinue
          if ($null -eq $item) { return $false }
          return [bool]($item.LinkType -eq 'SymbolicLink' -and $item.Target -eq "${WinGetConfigRoot}\profile.ps1")
        SetScript: |
          $source = "${WinGetConfigRoot}\profile.ps1"
          if (-not (Test-Path -Path $source -PathType Leaf)) {
            throw "원본 프로필을 찾을 수 없습니다: $source"
          }
          $profilePath = pwsh -NoProfile -Command 'Write-Output $PROFILE'
          New-Item -ItemType Directory -Force -Path (Split-Path $profilePath)
          if (Test-Path -Path $profilePath) {
            Move-Item -Path $profilePath -Destination "${profilePath}.backup" -Force
          }
          New-Item -ItemType SymbolicLink -Path $profilePath -Target $source

  configurationVersion: 0.2.0