# https://github.com/microsoft/winget-dsc
# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2

properties:
  resources:
    - resource: PSDscResources/Script
      id: NvidiaAppInstall
      directives:
        description: NVIDIA 공식 다운로드 페이지의 최신 NVIDIA App 설치 또는 업데이트
      settings:
        SetScript: |
          & "${WinGetConfigRoot}\nvidia.ps1" -Mode Set
        GetScript: |
          & "${WinGetConfigRoot}\nvidia.ps1" -Mode Get
        TestScript: |
          & "${WinGetConfigRoot}\nvidia.ps1" -Mode Test

    # 같은 최신 버전 확인/설치 로직을 update-non-winget.ps1에서도 사용함.

  configurationVersion: 0.2.0
